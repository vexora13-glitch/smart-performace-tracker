project_id = "vexora-client-portal"

[api]
enabled = true
port = 56421
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 56422
major_version = 17
shadow_port = 56420

[auth]
enabled = true
site_url = "https://smart-performace-tracker-cirkdbyf5-vexoranz.vercel.app"
additional_redirect_urls = ["http://localhost:5173"]
jwt_expiry = 3600
enable_signup = false
minimum_password_length = 12
password_requirements = "lower_upper_letters_digits"

[auth.email]
enabled = true
enable_confirmations = true

[storage]
enabled = true
file_size_limit = "100MiB"

# Staff MFA: Vexbot knowledge and settings changes require an AAL2 (TOTP) session.
[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true
